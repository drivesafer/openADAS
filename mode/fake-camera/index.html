<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Fake Camera / Debug Source</title>
  <style>
    :root { --bg:#0b0b0b; --panel:#111; --green:#00ff66; }
    html,body{height:100%; margin:0; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
    #wrap{display:grid; grid-template-columns:minmax(300px, 1fr) 320px; height:100vh;}
    #view{display:flex; align-items:center; justify-content:center; background:#000;}
    video{max-width:100%; max-height:100%; background:#000;}
    #side{padding:16px; border-left:1px solid rgba(255,255,255,.1); background:#111; display:flex; flex-direction:column; gap:12px;}
    .h{font-size:14px; color:var(--green); letter-spacing:1px; font-weight:800; text-transform:uppercase}
    .row{display:flex; flex-direction:column; gap:6px}
    select, button{
      background:#0f0f0f; color:#fff; border:1px solid rgba(255,255,255,.14);
      border-radius:12px; padding:10px 12px; font-size:14px;
    }
    .small{font-size:12px; color:#bbb; line-height:1.4}
    #status{font-size:12px; color:#ffcc66; margin-top:auto; white-space:pre-wrap;}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="view">
      <video id="vid" playsinline muted controls></video>
    </div>

    <div id="side">
      <div class="h">Fake Camera</div>

      <div class="row">
        <div class="small">Source</div>
        <select id="sourceSel">
          <option value="camera" selected>Camera</option>
          <option value="file">Debug video (input/test1.mp4)</option>
        </select>
      </div>

      <div class="row">
        <div class="small">Camera</div>
        <select id="camSel"></select>
      </div>

      <button id="refreshBtn">Refresh cameras</button>

      <div class="small">
        This page is just a reusable source demo.
        Other modes should import <code>createVideoSourceController()</code> from <code>fake-camera/detect.js</code>.
      </div>

      <div id="status">Initializing...</div>
    </div>
  </div>

  <script type="module">
    import { createVideoSourceController } from './detect.js';

    const video = document.getElementById('vid');
    const sourceSel = document.getElementById('sourceSel');
    const camSel = document.getElementById('camSel');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');

    const controller = createVideoSourceController({
      video,
      sourceSelect: sourceSel,
      cameraSelect: camSel,
      statusEl,
      defaultDebugVideoSrc: '../../input/test1.mp4'
    });

    controller.onAfterSourceChange = () => {
      statusEl.textContent =
        `Ready\n` +
        `Source: ${sourceSel.value}\n` +
        `Size: ${video.videoWidth} x ${video.videoHeight}\n` +
        `Debug file: ${controller.getDebugVideoSrc()}`;
    };

    controller.onSourceError = (e) => {
      statusEl.textContent = `Source Error: ${e.message}`;
    };

    refreshBtn.onclick = async () => {
      try {
        await controller.listCameras();
        statusEl.textContent = `Camera list refreshed.\nFound ${camSel.options.length} camera(s).`;
      } catch (e) {
        statusEl.textContent = `Refresh Error: ${e.message}`;
      }
    };

    (async () => {
      try {
        await controller.init();
        controller.onAfterSourceChange?.();
      } catch (e) {
        statusEl.textContent = `Init Error: ${e.message}`;
      }
    })();
  </script>
</body>
</html>
