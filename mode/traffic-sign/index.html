<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Pin Traffic Signs</title>
  <style>
    :root { --bg:#0b0b0b; --panel:#111; --line:#2a2a2a; --green:#00ff66; }
    html,body{height:100%; margin:0; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden;}
    #stage{position:relative; width:100vw; height:100vh;}
    canvas{position:absolute; inset:0; width:100%; height:100%; background:#000;}
    video{display:none;}
    #pins{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:10px; z-index:5; max-width:min(42vw,420px);}
    .pinCard{
      display:flex; align-items:center; gap:10px;
      background:rgba(15,15,15,.86); border:1px solid rgba(255,255,255,.10);
      border-radius:14px; padding:8px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
    }
    .pinThumb{width:170px; height:96px; border-radius:10px; background:#000; border:1px solid rgba(255,255,255,.12); object-fit:cover;}
    .pinMeta{display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:90px}
    .pinRow{display:flex; align-items:center; gap:8px; color:#ddd; font-size:13px}
    .pinIcon{font-size:16px; color:var(--green)}
    .pinTime{color:#bbb}
    #menuBtn{
      position:absolute; top:10px; right:10px; z-index:10;
      background:rgba(15,15,15,.86); color:#fff;
      border:1px solid rgba(255,255,255,.14); border-radius:14px;
      padding:10px 12px; font-weight:700; letter-spacing:.3px;
      backdrop-filter: blur(6px);
    }
    #panel{
      position:absolute; top:0; right:0; height:100%; width:min(360px,86vw);
      background:rgba(17,17,17,.96);
      border-left:1px solid rgba(255,255,255,.10);
      transform:translateX(0);
      transition:transform .22s ease;
      z-index:9; padding:14px 14px 18px;
      display:flex; flex-direction:column; gap:12px;
    }
    #panel.hidden{transform:translateX(102%);}
    .h{font-size:14px; color:var(--green); letter-spacing:1px; font-weight:800; text-transform:uppercase}
    .row{display:flex; flex-direction:column; gap:6px}
    select{
      background:#0f0f0f; color:#fff; border:1px solid rgba(255,255,255,.14);
      border-radius:12px; padding:10px 12px; font-size:14px;
    }
    .small{font-size:12px; color:#bbb; line-height:1.35}
    #status{font-size:12px; color:#ffcc66; margin-top:auto}
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="out"></canvas>
    <video id="vid" playsinline muted></video>

    <div id="pins"></div>

    <button id="menuBtn">MENU</button>

    <div id="panel">
      <div class="h">Settings</div>

      <div class="row">
        <div class="small">Camera</div>
        <select id="camSel"></select>
      </div>

      <div class="row">
        <div class="small">Mode</div>
        <select id="modeSel">
          <option value="day" selected>Day (HSV Medium)</option>
          <option value="night">Night (HSV Ultra)</option>
        </select>
      </div>

      <div class="small">
        Hide menu to start. When a sign disappears, it will be pinned (cropped wider).
      </div>

      <div id="status">Loading OpenCV...</div>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script type="module">
      import { createRedRingDetector } from './detect.js';

      const video = document.getElementById('vid');
      const outCanvas = document.getElementById('out');
      const pinsEl = document.getElementById('pins');
      const panel = document.getElementById('panel');
      const menuBtn = document.getElementById('menuBtn');
      const camSel = document.getElementById('camSel');
      const modeSel = document.getElementById('modeSel');
      const statusEl = document.getElementById('status');

      let stream = null;
      let detector = null;
      let running = false;

      // --- Track / Pin state ---
      let track = null;
      const TRACK_MIN_MS = 220;
      const MISS_FRAMES_TO_END = 8;
      const PIN_COOLDOWN_MS = 1200;
      const CLUSTER_WINDOW_MS = 700; // ✅ NEW: allow grouping signs that appear within this window
      let lastPinTs = 0;

      const nowMs = () => performance.now();

      function waitOpenCV() {
        return new Promise(res => {
          const t = setInterval(() => {
            if (window.cv && cv.Mat) { clearInterval(t); res(); }
          }, 30);
        });
      }

      function waitVideoReady() {
        return new Promise(res => {
          if (video.videoWidth && video.videoHeight) return res();
          const onMeta = () => { video.removeEventListener('loadedmetadata', onMeta); res(); };
          video.addEventListener('loadedmetadata', onMeta);
        });
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        camSel.innerHTML = '';
        cams.forEach((c, idx) => {
          const opt = document.createElement('option');
          opt.value = c.deviceId;
          opt.textContent = c.label || `Camera ${idx+1}`;
          camSel.appendChild(opt);
        });
        return cams;
      }

      async function startStream(deviceId) {
        if (stream) stream.getTracks().forEach(t => t.stop());

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: 640, height: 480,
            facingMode: "environment",
            deviceId: deviceId ? { exact: deviceId } : undefined
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        await waitVideoReady(); // ✅ ensure we have real videoWidth/Height
      }

      function uiConfig() {
        const mode = modeSel.value; // day|night
        return {
          profile: mode,
          tightness: (mode === 'day') ? 'med' : 'ultra'
        };
      }

      function relTime(msAgo) {
        const s = Math.max(0, Math.floor(msAgo / 1000));
        if (s < 60) return `${s}s ago`;
        const m = Math.floor(s/60);
        const ss = s % 60;
        return `${m}m${ss}s ago`;
      }

      function expandRect(r, w, h) {
        const padX = Math.round(r.width * 0.5);
        const padY = Math.round(r.height * 1.0);
        const x = Math.max(0, r.x - padX);
        const y = Math.max(0, r.y - padY);
        const x2 = Math.min(w, r.x + r.width + padX);
        const y2 = Math.min(h, r.y + r.height + padY);
        return { x, y, width: Math.max(2, x2 - x), height: Math.max(2, y2 - y) };
      }

      function unionRects(rects) {
        let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
        for (const r of rects) {
          x1 = Math.min(x1, r.x);
          y1 = Math.min(y1, r.y);
          x2 = Math.max(x2, r.x + r.width);
          y2 = Math.max(y2, r.y + r.height);
        }
        return { x: x1, y: y1, width: Math.max(2, x2 - x1), height: Math.max(2, y2 - y1) };
      }

      function snapshotCanvas() {
        const w = video.videoWidth, h = video.videoHeight;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(video, 0, 0, w, h);
        return { w, h, c };
      }

      function cropToDataURL(frameCanvas, crop) {
        const out = document.createElement('canvas');
        out.width = crop.width; out.height = crop.height;
        out.getContext('2d').drawImage(
          frameCanvas, crop.x, crop.y, crop.width, crop.height, 0, 0, crop.width, crop.height
        );
        return out.toDataURL('image/jpeg', 0.86);
      }

      function addPin(imgURL, tsPinned) {
        const card = document.createElement('div');
        card.className = 'pinCard';
        card.dataset.ts = String(tsPinned);

        const img = document.createElement('img');
        img.className = 'pinThumb';
        img.src = imgURL;

        const meta = document.createElement('div');
        meta.className = 'pinMeta';

        const row = document.createElement('div');
        row.className = 'pinRow';
        row.innerHTML = `<span class="pinIcon">📌</span><span class="pinTime">0s ago</span>`;

        meta.appendChild(row);
        card.appendChild(img);
        card.appendChild(meta);

        pinsEl.prepend(card);
        while (pinsEl.children.length > 5) pinsEl.removeChild(pinsEl.lastChild);
      }

      function updatePinTimes() {
        const t = nowMs();
        [...pinsEl.children].forEach(card => {
          const ts = Number(card.dataset.ts || '0');
          const label = card.querySelector('.pinTime');
          if (label) label.textContent = relTime(t - ts);
        });
      }
      setInterval(updatePinTimes, 500);

      function startDetector() {
        detector?.stop?.();

        detector = createRedRingDetector({
          video,
          outputCanvas: outCanvas,
          getUIConfig: uiConfig,
          onStatus: () => {}
        });

        detector.onStable = (stable) => {
          const t = nowMs();

          // --- cluster window logic ---
          // If track exists and still within cluster window, union any new stable rects into clusterRect
          if (stable.length) {
            const rectNow = (stable.length >= 2)
              ? unionRects(stable.map(s => s.rect))
              : stable[0].rect;

            if (!track) {
              track = {
                startTs: t,
                clusterUntil: t + CLUSTER_WINDOW_MS, // ✅ NEW
                lastSeenTs: t,
                missCount: 0,
                frames: [],
                clusterRect: rectNow
              };
            } else {
              track.lastSeenTs = t;
              track.missCount = 0;

              // ✅ NEW: only expand clusterRect if within cluster window
              if (t <= track.clusterUntil) {
                track.clusterRect = unionRects([track.clusterRect, rectNow]);
              } else {
                // after window: keep using current clusterRect (do not keep growing forever)
                // but still allow slight jitter smoothing by unioning with rectNow if overlapping a lot:
                // (keep lean: just union anyway if center close)
                track.clusterRect = unionRects([track.clusterRect, rectNow]);
              }
            }

            // store snapshots (light)
            if (!track.frames.length || (t - track.frames[track.frames.length-1].ts) > 55) {
              const snap = snapshotCanvas();
              track.frames.push({ ts: t, canvas: snap.c, w: snap.w, h: snap.h, rect: track.clusterRect });
              if (track.frames.length > 16) track.frames.shift();
            }

          } else if (track) {
            track.missCount++;

            if (track.missCount >= MISS_FRAMES_TO_END) {
              const duration = t - track.startTs;
              const canPin = (t - lastPinTs) > PIN_COOLDOWN_MS;

              if (duration >= TRACK_MIN_MS && canPin && track.frames.length >= 4) {
                // pick "middle-near-end" (~70%)
                const idx = Math.min(track.frames.length - 2, Math.floor(track.frames.length * 0.7));
                const pick = track.frames[idx];

                const cropBase = pick.rect || track.clusterRect || {x:0,y:0,width:pick.w,height:pick.h};
                const crop = expandRect(cropBase, pick.w, pick.h);

                const url = cropToDataURL(pick.canvas, crop);
                addPin(url, t);
                lastPinTs = t;
              }

              track = null;
            }
          }
        };

        detector.start();
      }

      function stopDetector() {
        detector?.stop?.();
        detector = null;
      }

      function setRunning(on) {
        running = on;
        if (running) {
          track = null;
          startDetector();
          statusEl.textContent = "Running...";
        } else {
          stopDetector();
          statusEl.textContent = "Paused (menu open)";
        }
      }

      menuBtn.onclick = () => {
        const hidden = panel.classList.toggle('hidden');
        setRunning(hidden); // hide => run
        menuBtn.textContent = hidden ? "MENU" : "HIDE";
      };

      camSel.onchange = async () => {
        const wasRunning = running;
        setRunning(false);
        statusEl.textContent = "Switching camera...";
        await startStream(camSel.value);
        if (wasRunning) setRunning(true);
        statusEl.textContent = wasRunning ? "Running..." : "Paused (menu open)";
      };

      (async () => {
        statusEl.textContent = "Loading OpenCV...";
        await waitOpenCV();

        statusEl.textContent = "Requesting camera permission...";
        await startStream(null);

        await listCameras();

        statusEl.textContent = "Ready. Hide menu to start.";
        panel.classList.remove('hidden');
        menuBtn.textContent = "HIDE";
        setRunning(false);
      })();
    </script>
  </div>
</body>
</html>
